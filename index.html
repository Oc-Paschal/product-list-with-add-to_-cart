<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product List</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <main class="p-3  max-w-7xl mx-auto">
        <h1 class="font-extrabold text-2xl pl-4 mb-4">Desserts</h1>
        <div class="flex  flex-col lg:flex-row  gap-4">
        <div id="product-list" class=" grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 flex-1"> </div>
          <div class="min-h-100 sm:w-full lg:w-xs  w-full bg-white rounded-xl shadow-md p-6 ">
            <h2 class="text-red-500  p-4  text-xl font-extrabold">
              Your cart(<span id="product-count">0</span>)
            </h2>
            <div id="cart-items" class="space-y-4 mt-4"></div>
            <div class="flex justify-between font-semibold text-gray-800">
              <span>Order Total</span>
              <span id="orderTotal">$0.00</span>
            </div>
            <div class="flex items-center gap-2 bg-gray-100 text-xs text-gray-600 rounded-md p-3 mt-4">
              <img src="./assets/images/icon-carbon-neutral.svg" alt="">
              <span>This is a carbon-neutral delivery</span>
            </div>
            <button id="confirmOrderBtn"
              class=" mt-6 w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-full transition cursor-pointer">
              Confirm Order
            </button>

          </div>
        </div>
        
<div
  id="orderModal"
  class="fixed inset-0 bg-black/40 flex items-center justify-center hidden z-50"
>
  <div class="bg-white w-[90%] max-w-md rounded-2xl p-6">
    
    <div class="text-center">
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-green-100 text-green-600">
      <img src="./assets/images/icon-order-confirmed.svg">
      </div>
      <h2 class="text-xl font-bold text-gray-900">Order Confirmed</h2>
      <p class="text-sm text-gray-500">We hope you enjoy your food!</p>
    </div>
    
    <div id="orderSummary" class="mt-6 space-y-3 bg-gray-50 p-4 rounded-lg">
    </div>

    <div class="mt-4 flex items-center justify-between text-gray-900 font-semibold">
      <span>Order Total</span>
      <span id="modalOrderTotal">$0.00</span>
    </div>

    <button
      id="newOrderBtn"
      class="mt-6 w-full rounded-full bg-orange-600 py-3 text-white font-semibold hover:bg-orange-700 transition"
    >
      Start New Order
    </button>
  </div>
</div>

  </main>

  <script src="script.js"></script>
</body>

</html>
